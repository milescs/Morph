<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.36" stop-color="#7C3AED"/>
      <stop offset="0.72" stop-color="#DB2777"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.26" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.85" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shape" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5EDFF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="shapeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2E1065" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- Squircle body -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#iconShadow)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bloom)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#ember)"/>

    <!-- Motion trail -->
    <path d="M 262 802 C 330 640, 460 470, 690 348" fill="none" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" stroke-linecap="round" stroke-dasharray="1 30"/>

    <!-- Glow behind the final shape -->
    <circle cx="672" cy="352" r="170" fill="#FFFFFF" opacity="0.35" filter="url(#glow)"/>

    <!-- Square → rounded square → circle -->
    <g filter="url(#shapeShadow)">
      <rect x="208" y="624" width="176" height="176" rx="26" fill="url(#shape)" opacity="0.40"/>
      <rect x="342" y="468" width="212" height="212" rx="74" fill="url(#shape)" opacity="0.66"/>
      <circle cx="672" cy="352" r="158" fill="url(#shape)"/>
    </g>
    <!-- Glass sheen on the circle -->
    <ellipse cx="640" cy="276" rx="104" ry="54" fill="url(#sheen)" opacity="0.55" transform="rotate(-22 640 276)"/>

    <!-- Sparkle -->
    <path d="M 800 548 C 806 584, 820 598, 856 604 C 820 610, 806 624, 800 660 C 794 624, 780 610, 744 604 C 780 598, 794 584, 800 548 Z"
          fill="#FFFFFF" opacity="0.92"/>

    <!-- Glass edge -->
    <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="4"/>
  </g>
</svg>
