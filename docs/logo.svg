<svg xmlns="http://www.w3.org/2000/svg" width="1108" height="340" viewBox="0 0 1108 340">
  <defs>
    <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="1078" y2="0">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="0.45" stop-color="#A855F7"/>
      <stop offset="0.78" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <g transform="translate(-6 14) scale(0.30)">
    
  <defs>
    <linearGradient id="i-bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.36" stop-color="#7C3AED"/>
      <stop offset="0.72" stop-color="#DB2777"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="i-bloom" cx="0.26" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i-ember" cx="0.85" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i-shape" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5EDFF"/>
    </linearGradient>
    <linearGradient id="i-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="i-iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="i-shapeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2E1065" flood-opacity="0.38"/>
    </filter>
    <filter id="i-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="i-body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- Squircle body -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#i-bg)" filter="url(#i-iconShadow)"/>
  <g clip-path="url(#i-body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#i-bloom)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#i-ember)"/>

    <!-- Motion trail -->
    <path d="M 262 802 C 330 640, 460 470, 690 348" fill="none" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" stroke-linecap="round" stroke-dasharray="1 30"/>

    <!-- Glow behind the final shape -->
    <circle cx="672" cy="352" r="170" fill="#FFFFFF" opacity="0.35" filter="url(#i-glow)"/>

    <!-- Square → rounded square → circle -->
    <g filter="url(#i-shapeShadow)">
      <rect x="208" y="624" width="176" height="176" rx="26" fill="url(#i-shape)" opacity="0.40"/>
      <rect x="342" y="468" width="212" height="212" rx="74" fill="url(#i-shape)" opacity="0.66"/>
      <circle cx="672" cy="352" r="158" fill="url(#i-shape)"/>
    </g>
    <!-- Glass sheen on the circle -->
    <ellipse cx="640" cy="276" rx="104" ry="54" fill="url(#i-sheen)" opacity="0.55" transform="rotate(-22 640 276)"/>

    <!-- Sparkle -->
    <path d="M 800 548 C 806 584, 820 598, 856 604 C 820 610, 806 624, 800 660 C 794 624, 780 610, 744 604 C 780 598, 794 584, 800 548 Z"
          fill="#FFFFFF" opacity="0.92"/>

    <!-- Glass edge -->
    <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="4"/>
  </g>

  </g>
  <g fill="none" stroke="url(#word)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 330 230 V 70 L 405 185 L 480 70 V 230"/>
    <path d="M 538.0 180.0 a 50.0 50.0 0 1 0 100.0 0 a 50.0 50.0 0 1 0 -100.0 0"/>
    <path d="M 688 230 V 178 A 48 48 0 0 1 736 130 H 750"/>
    <path d="M 798 290 V 148 M 798 180.0 a 50.0 50.0 0 1 0 100.0 0 a 50.0 50.0 0 1 0 -100.0 0"/>
    <path d="M 948 70 V 230 M 948 180 A 50 50 0 0 1 1048 180 V 230"/>
  </g>
</svg>
