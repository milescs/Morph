name: Suggest an idea
description: A format, a destination preset or a feature you'd like.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Morph to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What are you trying to get done?
      description: The situation behind the idea, e.g. "I have to upload scans to a portal that only accepts 2 MB PDFs".
