name: Morph
options:
  bundleIdPrefix: com.milessmith
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: NWTRA7934U
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES
packages:
  MorphKit:
    path: MorphKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  Morph:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MorphKit
      - package: Sparkle
      - target: MorphCompressAction
      - target: MorphConvertAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milessmith.Morph
        PRODUCT_NAME: Morph
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Resources/Morph.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # Sparkle's EdDSA public key (the private key lives in the release machine's keychain).
        SPARKLE_PUBLIC_KEY: "CY5hClXG7EYtiMJlzpmub/WPw1Rf1SvTJJsG85Jimow="
    postBuildScripts:
      - name: Embed FFmpeg
        script: '"${SRCROOT}/scripts/embed-ffmpeg.sh"'
        basedOnDependencyAnalysis: false
  MorphCompressAction:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/QuickActions
        excludes: ["*.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milessmith.Morph.CompressAction
        PRODUCT_NAME: MorphCompressAction
        INFOPLIST_FILE: Extensions/QuickActions/Compress-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extensions/QuickActions/QuickActions.entitlements
        SKIP_INSTALL: YES
  MorphConvertAction:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/QuickActions
        excludes: ["*.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milessmith.Morph.ConvertAction
        PRODUCT_NAME: MorphConvertAction
        INFOPLIST_FILE: Extensions/QuickActions/Convert-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extensions/QuickActions/QuickActions.entitlements
        SKIP_INSTALL: YES
schemes:
  Morph:
    build:
      targets:
        Morph: all
    run:
      config: Debug
    archive:
      config: Release
